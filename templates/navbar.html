<!-- ==========================================
     BOOKORA NAVBAR - REUSABLE COMPONENT
     Fixed to Ahmedabad, Gujarat
     ========================================== -->

<nav class="navbar navbar-expand-lg navbar-bookora">
    <div class="container-fluid" style="padding: 0 2rem;">
        <a class="navbar-brand" href="/">Bookora</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto ms-4">
                <li class="nav-item">
                    <a class="nav-link" href="/#movies">Movies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="alert('Events coming soon!'); return false;">Events</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/#offers">Offers</a>
                </li>
            </ul>
            
            <!-- City (Fixed to Ahmedabad) -->
            <div class="city-display">
                <i class="fas fa-map-marker-alt"></i>
                <span>Ahmedabad, Gujarat</span>
            </div>
            
            <!-- Search Bar (optional, only on home) -->
            <div class="search-bar-bookora" id="navbar-search" style="display: none;">
                <input type="text" placeholder="Search movies...">
            </div>
            
            <!-- Auth Buttons / Profile -->
            <div class="auth-buttons" id="authButtons">
                <button class="btn-login" onclick="openSignInModal()">Login</button>
                <button class="btn-signup" onclick="openSignInModal()">Sign Up</button>
            </div>
            
            <div class="profile-section" id="profileSection" style="display: none;">
                <a href="#" class="profile-link" id="userProfileLink">
                    <i class="fas fa-user-circle"></i>
                    <span id="userNameDisplay">Profile</span>
                </a>
            </div>
        </div>
    </div>
</nav>

<style>
    .navbar-bookora {
        background: #faf8f5;
        border-bottom: 1px solid #e8e3dc;
        padding: 0.8rem 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 1px 3px rgba(42, 37, 32, 0.06);
    }
    
    .navbar-bookora .navbar-brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #2a2520;
        text-decoration: none;
    }
    
    .navbar-bookora .nav-link {
        color: #6b6560;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.5rem 1rem;
        transition: color 0.2s;
    }
    
    .navbar-bookora .nav-link:hover {
        color: #d4a59a;
    }
    
    .city-display {
        display: flex;
        align-items: center;
        background: #ffffff;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 1px solid #e8e3dc;
        box-shadow: 0 1px 3px rgba(42, 37, 32, 0.06);
        color: #2a2520;
        font-weight: 500;
        margin: 0 1rem;
    }
    
    .city-display i {
        color: #d4a59a;
        margin-right: 0.5rem;
    }
    
    .search-bar-bookora {
        flex: 1;
        max-width: 280px;
        margin: 0 1.5rem;
    }
    
    .search-bar-bookora input {
        width: 100%;
        padding: 0.65rem 1.2rem;
        background: #ffffff;
        border: 1px solid #e8e3dc;
        border-radius: 8px;
        color: #2a2520;
        box-shadow: 0 1px 3px rgba(42, 37, 32, 0.06);
        transition: all 0.2s;
    }
    
    .search-bar-bookora input:focus {
        outline: none;
        border-color: #d4a59a;
        box-shadow: 0 2px 12px rgba(212, 165, 154, 0.15);
    }
    
    .auth-buttons {
        display: flex;
        gap: 0.75rem;
    }
    
    .btn-login {
        background: transparent;
        color: #6b6560;
        border: 1px solid #e8e3dc;
        padding: 0.55rem 1.3rem;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
    }
    
    .btn-login:hover {
        background: #f5e8e5;
        border-color: #e8cfc8;
        color: #c28f83;
    }
    
    .btn-signup {
        background: #d4a59a;
        color: white;
        border: none;
        padding: 0.55rem 1.3rem;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
    }
    
    .btn-signup:hover {
        background: #c28f83;
    }
    
    .profile-section {
        margin-left: 1rem;
    }
    
    .profile-link {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #2a2520;
        text-decoration: none;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        transition: background 0.2s;
    }
    
    .profile-link:hover {
        background: #f5e8e5;
    }
    
    .profile-link i {
        font-size: 1.5rem;
        color: #d4a59a;
    }
    
    @media (max-width: 991px) {
        .city-display, .search-bar-bookora, .auth-buttons {
            margin: 0.5rem 0;
        }
    }
</style>

<script>
    // Check user session and update navbar
    function checkNavbarAuth() {
        const user = localStorage.getItem('bookora_user');
        const authButtons = document.getElementById('authButtons');
        const profileSection = document.getElementById('profileSection');
        const userNameDisplay = document.getElementById('userNameDisplay');
        
        if (user) {
            try {
                const userData = JSON.parse(user);
                authButtons.style.display = 'none';
                profileSection.style.display = 'block';
                userNameDisplay.textContent = userData.name || 'Profile';
            } catch (e) {
                console.error('Error parsing user data:', e);
            }
        } else {
            authButtons.style.display = 'flex';
            profileSection.style.display = 'none';
        }
    }
    
    // Run on page load
    document.addEventListener('DOMContentLoaded', checkNavbarAuth);
    
    // Also export for external use
    if (typeof window !== 'undefined') {
        window.checkNavbarAuth = checkNavbarAuth;
    }
</script>
